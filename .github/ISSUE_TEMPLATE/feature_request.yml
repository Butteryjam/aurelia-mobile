name: Feature Request
description: Suggest an improvement or new capability for Aurelia Mobile
title: "[Feature]: "
labels: ["enhancement", "mobile"]
body:
  - type: markdown
    attributes:
      value: |
        Feature proposals and improvements are welcome. Please describe your suggestion clearly.
  - type: textarea
    id: problem
    attributes:
      label: The Problem Being Experienced
      description: Describe the limitation or difficulty you encountered in your cooking or planning workflow.
      placeholder: e.g. When cooking multiple dishes simultaneously, switching between recipes loses timer context...
    validations:
      required: true
  - type: textarea
    id: proposed_improvement
    attributes:
      label: Proposed Improvement
      description: Describe the change or capability you would like to see.
      placeholder: e.g. Add a persistent timer bar at the bottom of the screen...
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: How should the feature behave from a user's perspective?
      placeholder: e.g. Tapping on the persistent timer bar should navigate directly back to the active recipe step...
    validations:
      required: true
  - type: textarea
    id: supporting_context
    attributes:
      label: Supporting Context
      description: Any mockups, alternatives considered, or additional details.
