name: Bug Report
description: Report a reproducible bug or unexpected behavior in Aurelia Mobile
title: "[Bug]: "
labels: ["bug", "mobile"]
body:
  - type: markdown
    attributes:
      value: |
        Please fill out this form to report a bug. Do not include sensitive information such as passwords, tokens, or private credentials.
  - type: input
    id: affected_screen
    attributes:
      label: Affected Screen or Feature
      description: Where in the app does this issue occur?
      placeholder: e.g. Cook Mode, Recipe Editor, Meal Planner, Search, Shopping List
    validations:
      required: true
  - type: input
    id: device_info
    attributes:
      label: Device and Android Version
      description: Hardware model and operating system version tested.
      placeholder: e.g. Google Pixel 7 (Android 14) / Samsung Galaxy S22 (Android 13)
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App Version / Build
      description: The version or build number of the application.
      placeholder: e.g. 1.0.0 (preview build) / Expo SDK 57
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Open the app
        2. Navigate to '...'
        3. Tap on '...'
        4. Observe the issue
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened.
      placeholder: e.g. The timer should start counting down and trigger an alert when finished.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened instead.
      placeholder: e.g. The app freezes or the timer resets to zero immediately.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Relevant Screenshot or Video
      description: Drag and drop screenshots or screen recordings illustrating the bug.
  - type: textarea
    id: error_logs
    attributes:
      label: Error Message / Stack Trace
      description: Any error messages or console output. Redact any sensitive information before submitting.
      render: shell
