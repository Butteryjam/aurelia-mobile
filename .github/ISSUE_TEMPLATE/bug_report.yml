name: "🐛 Bug Report"
description: "File a report to help us fix a bug in Aurelia Mobile"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue with Aurelia Mobile!
        Please fill out this form as completely as possible to help us triage and resolve it quickly.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem encountered...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open the app
        2. Navigate to '...'
        3. Tap on '....'
        4. Observe unexpected behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened instead.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android (Physical Device)
        - Android (Emulator)
        - iOS (Physical Device)
        - iOS (Simulator)
        - Web
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: OS Version & Device Model
      placeholder: e.g. Android 14, Samsung Galaxy S23 / iOS 17.5, iPhone 15 Pro
  - type: input
    id: app_version
    attributes:
      label: App & Expo SDK Version
      placeholder: e.g. Aurelia Mobile v1.0.0, Expo SDK 57
  - type: textarea
    id: logs
    attributes:
      label: Logs / Stack Trace
      description: Any relevant error messages or console logs.
      render: shell
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or screen recordings here.
